<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Anh Vuong's Resume</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 30px 20px; 
            background: linear-gradient(135deg, #1e1e24 0%, #111115 100%); 
            color: #f5f5f7;
            min-height: 100vh;
        }

        .container { 
            max-width: 950px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.03); 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        h1 { 
            font-size: 2.2rem; 
            color: #ffffff; 
            margin-bottom: 5px; 
            font-weight: 600; 
            letter-spacing: -0.5px; 
        }

        p { 
            color: #a0a0ab; 
            font-size: 1.1rem; 
            margin-top: 0; 
            margin-bottom: 25px; 
        }

        iframe { 
            width: 100%; 
            height: 80vh; 
            border: none; 
            border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Anh Vuong's Resume</h1>
        <p>You can view or print my resume directly below.</p>
        
        <!-- This embeds your resume.pdf onto the page -->
        <iframe src="Files\Anh_Vuong_Resume_ENG.pdf"></iframe>
    </div>

</body>
</html>
